<div class="form-field{% if field.errors %} form-field--error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% if field.field.widget.input_type == "password" %}
    <div class="password-field">
      {{ field }}
      <button type="button"
              class="password-toggle"
              data-password-toggle
              aria-controls="{{ field.id_for_label }}"
              aria-pressed="false"
              aria-label="Show password">
        <span data-password-toggle-label>Show</span>
      </button>
    </div>
  {% else %}
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p id="{{ field.id_for_label }}-help" class="field-help">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}
    <ul class="field-errors"
        id="{{ field.id_for_label }}-errors"
        role="alert">
      {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
  {% endif %}
</div>
