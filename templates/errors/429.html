{% extends "base.html" %}
{% block title %}Too many requests — Nelna FG Digital Recording System{% endblock %}
{% block content %}
  <section class="error-page-card" aria-labelledby="error-heading">
    <h1 id="error-heading">429 — Too many requests</h1>
    <p>Please wait a moment and try again.</p>
    <p>
      {% if user.is_authenticated %}
        <a href="{% url 'accounts:landing' %}">Return to dashboard</a>
      {% else %}
        <a href="{% url 'accounts:login' %}">Sign in</a>
      {% endif %}
    </p>
  </section>
{% endblock %}
