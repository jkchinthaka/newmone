name: Docker Image CI

# Retired as an automatic job. API and web images are built by Docker Build Check
# and Release Validation. This file stays so the old workflow name is not deleted
# silently. It does not deploy.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  not-a-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Production deploy is not enabled
        run: |
          echo "PRODUCTION_CD=NOT_ENABLED"
          echo "This manual job does not build or publish an image and does not deploy."
          echo "Use Docker Build Check for image builds."
