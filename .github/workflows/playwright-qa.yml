name: Playwright QA (local stack critical path)

# Runs only on demand until a disposable CI stack is provisioned.
# Requires repository secrets for seeded persona password materialization.
on:
  workflow_dispatch:

jobs:
  playwright-qa-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: maintainpro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: maintainpro/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: API tests
        run: npm run test
      - name: Web unit tests
        run: npm run test --workspace @maintainpro/web
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: maintainpro/apps/web
      - name: Materialize .env.e2e
        env:
          E2E_PASSWORD: ${{ secrets.MAINTAINPRO_E2E_PASSWORD }}
        run: |
          if [ -z "$E2E_PASSWORD" ]; then
            echo "MAINTAINPRO_E2E_PASSWORD secret is required"
            exit 1
          fi
          cat > .env.e2e <<EOF
          E2E_BASE_URL=http://127.0.0.1:3001
          E2E_API_URL=http://127.0.0.1:3000
          E2E_SUPERADMIN_EMAIL=superadmin@maintainpro.local
          E2E_ADMIN_EMAIL=admin@maintainpro.local
          E2E_MANAGER_EMAIL=manager@maintainpro.local
          E2E_TECH_EMAIL=tech@maintainpro.local
          E2E_SECURITY_EMAIL=security@maintainpro.local
          E2E_INVENTORY_EMAIL=inventory@maintainpro.local
          E2E_PASSWORD=${E2E_PASSWORD}
          MAINTAINPRO_SEED_PASSWORD=${E2E_PASSWORD}
          EOF
      - name: Note
        run: |
          echo "Critical-path Playwright QA expects a provisioned API/web/DB stack."
          echo "Wire stack bring-up before enabling this job on PRs."
      - name: Upload report if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-qa-report
          path: |
            maintainpro/apps/web/playwright-report/
            maintainpro/apps/web/test-results/
          if-no-files-found: ignore
