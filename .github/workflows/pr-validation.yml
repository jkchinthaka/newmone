name: PR Validation

on:
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

defaults:
  run:
    working-directory: maintainpro

jobs:
  validate-monorepo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # ts-jest type-checks each suite against the ~34 MB generated Prisma types; a single cold
      # suite needs ~2.2 GB and the full --runInBand run peaks ~3.3 GB (measured 2026-09-29),
      # above Node 20's ~2 GB default heap on the runner. Runner has 16 GB.
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: maintainpro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Tenant fail-open regression guard
        run: npm run audit:tenant

      - name: RBAC / authorization regression guard
        run: npm run audit:rbac

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test
        env:
          CI: true

      - name: Security-sensitive Jest suites
        run: npx jest --config ./jest.config.cjs --runInBand test/sensitive-data-hardening.spec.ts test/security-rbac-audit.spec.ts test/work-orders-tenant-isolation.spec.ts test/users-tenant-isolation.spec.ts
        working-directory: maintainpro/apps/api
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Critical product regression suites
        run: npx jest --config ./jest.config.cjs --runInBand test/auth-refresh-replay.spec.ts test/nav-favorites.spec.ts test/phase13-access.spec.ts test/work-order-erp-stock-boundary.spec.ts test/maintenance-reports.spec.ts test/planning-phase08.spec.ts test/fleet-lifecycle-phase10.spec.ts
        working-directory: maintainpro/apps/api
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api
          NEXT_PUBLIC_API_ORIGIN: http://localhost:3000
          NEXT_PUBLIC_USE_BFF: "true"

      - name: Note SQL Server migration gate
        run: echo "Fresh SQL Server migrate+seed is enforced by workflow sqlserver-migration-gate.yml on prisma/api path changes."

      - name: Secret and configuration safety
        run: npm run validate:secret-safety

      - name: Dependency audit (non-blocking informational)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Upload Jest coverage if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-coverage
          path: maintainpro/apps/api/coverage
          if-no-files-found: ignore
