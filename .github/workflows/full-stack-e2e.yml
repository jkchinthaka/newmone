name: Full-Stack E2E

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["test/phase4-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-stack-e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: maintainpro

jobs:
  full-stack-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_ENV: test
      E2E_TEST_MODE: "true"
      E2E_RUN_ID: ci-${{ github.run_id }}
      COMPOSE_PROJECT_NAME: maintainpro-e2e-ci-${{ github.run_id }}
      E2E_HTTP_PORT: "18080"
      E2E_BASE_URL: http://127.0.0.1:18080
      # Path only — never export disposable credentials via GITHUB_ENV/OUTPUT.
      MAINTAINPRO_E2E_ENV_FILE: ${{ github.workspace }}/maintainpro/.env.e2e
      APP_COMMIT_SHA: ${{ github.sha }}
      APP_BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
      E2E_DOCKER_RUNTIME: CI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: maintainpro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: maintainpro/apps/web

      - name: Secret safety
        run: npm run validate:secret-safety

      - name: Nondestructive Docker cleanup validation
        run: npm run validate:nondestructive-docker-cleanup

      - name: Text integrity validation
        run: npm run validate:text-integrity

      - name: Procurement controls validation
        run: npm run validate:e2e-procurement-controls

      - name: Dashboard report controls validation
        run: npm run validate:e2e-dashboard-report-controls

      - name: Recovery safety validation
        run: npm run validate:recovery-safety

      - name: Operations controls validation
        run: npm run validate:e2e-operations-controls

      - name: Production security and configuration gate
        run: |
          set -euo pipefail
          mkdir -p artifacts/e2e-logs
          npm run security:production-gate | tee artifacts/e2e-logs/production-security-gate.txt

      - name: UAT / training / rollback / go-live decision gate
        run: |
          set -euo pipefail
          mkdir -p artifacts/e2e-logs
          npm run uat:go-live-gate | tee artifacts/e2e-logs/uat-go-live-gate.txt
          export ROLLBACK_REHEARSAL=true
          npm run uat:rollback-rehearsal | tee artifacts/e2e-logs/rollback-rehearsal-gate.txt

      - name: Release-candidate stability structural validation
        run: npm run validate:release-candidate-stability

      - name: Prepare disposable E2E env file
        run: |
          export APP_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          node scripts/e2e-materialize-env.mjs

      - name: E2E safety validation
        run: npm run validate:e2e-safety

      - name: Validate E2E Compose config
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env.e2e \
            -f docker-compose.yml -f docker-compose.e2e.yml config --quiet

      - name: Build and start isolated E2E stack
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env.e2e \
            -f docker-compose.yml -f docker-compose.e2e.yml up -d --build

      - name: Wait for health
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl -fsS "$E2E_BASE_URL/api/health/live" >/dev/null \
              && curl -fsS "$E2E_BASE_URL/api/health/ready" >/dev/null \
              && curl -fsS "$E2E_BASE_URL/login" >/dev/null; then
              echo "healthy"
              docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env.e2e \
                -f docker-compose.yml -f docker-compose.e2e.yml ps
              exit 0
            fi
            sleep 5
          done
          echo "health timeout"
          mkdir -p artifacts/e2e-logs
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env.e2e \
            -f docker-compose.yml -f docker-compose.e2e.yml ps > artifacts/e2e-logs/compose-ps.txt || true
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env.e2e \
            -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=200 api > artifacts/e2e-logs/api-failure.log || true
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env.e2e \
            -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=200 web > artifacts/e2e-logs/web-failure.log || true
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env.e2e \
            -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=200 nginx > artifacts/e2e-logs/nginx-failure.log || true
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env.e2e \
            -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=200 mongo > artifacts/e2e-logs/mongo-failure.log || true
          sed -i -E 's/(password|secret|token|authorization)=[^[:space:]]+/\1=REDACTED/Ig' \
            artifacts/e2e-logs/*.log 2>/dev/null || true
          cat artifacts/e2e-logs/compose-ps.txt || true
          exit 1

      - name: Seed disposable data
        run: |
          # Host-side seed against loopback-published E2E Mongo only
          export E2E_DATABASE_URL_HOST="mongodb://e2e_app_not_prod:e2e_app_password_not_for_production_use@127.0.0.1:27019/maintainpro_e2e_primary?authSource=maintainpro_e2e_auth&replicaSet=rs0&directConnection=true"
          node scripts/e2e-seed.mjs

      - name: No-mock validation
        run: npm run validate:e2e-no-mocks

      - name: E2E environment preflight
        run: npm run e2e:env-preflight

      - name: Auth path diagnostic (A/B/C)
        id: auth_path_diag
        run: |
          set -e
          mkdir -p artifacts/e2e-logs
          # Disposable network probe only — never prints credentials or bodies.
          # Copy approved env into the compose bind mount path expected by the diag service.
          if [ ! -f .env.e2e ]; then
            cp "$MAINTAINPRO_E2E_ENV_FILE" .env.e2e
          fi
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env.e2e \
            -f docker-compose.yml -f docker-compose.e2e.yml \
            --profile diagnostics run --rm --no-deps e2e-auth-path-diag \
            | tee artifacts/e2e-logs/auth-path-diagnostic.txt

      - name: Collect auth-path failure evidence
        if: failure() && steps.auth_path_diag.outcome == 'failure'
        run: |
          mkdir -p artifacts/e2e-logs
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env.e2e \
            -f docker-compose.yml -f docker-compose.e2e.yml ps > artifacts/e2e-logs/compose-ps-auth-path.txt || true
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env.e2e \
            -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=200 api > artifacts/e2e-logs/api-auth-path.log || true
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env.e2e \
            -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=200 web > artifacts/e2e-logs/web-auth-path.log || true
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env.e2e \
            -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=200 nginx > artifacts/e2e-logs/nginx-auth-path.log || true
          sed -i -E 's/(password|secret|token|authorization)=[^[:space:]]+/\1=REDACTED/Ig' \
            artifacts/e2e-logs/*.log 2>/dev/null || true

      - name: Session CSRF diagnostic
        run: |
          set -e
          mkdir -p artifacts/e2e-logs
          npx playwright test e2e-real/session-diagnostic.spec.ts \
            --config=playwright.full-stack.config.ts \
            --project=chromium-desktop \
            | tee artifacts/e2e-logs/session-csrf-diagnostic.txt
        working-directory: maintainpro/apps/web
        env:
          SKIP_E2E_SEED: "true"
          MAINTAINPRO_E2E_ENV_FILE: ${{ github.workspace }}/maintainpro/.env.e2e

      - name: Work-order create gate (CSRF-003 path)
        run: |
          set -euo pipefail
          mkdir -p artifacts/e2e-logs
          npx playwright test e2e-real/work-order-create-diagnostic.spec.ts \
            --config=playwright.full-stack.config.ts \
            --project=chromium-desktop \
            | tee artifacts/e2e-logs/work-order-create-gate.txt
        working-directory: maintainpro/apps/web
        env:
          SKIP_E2E_SEED: "true"
          MAINTAINPRO_E2E_ENV_FILE: ${{ github.workspace }}/maintainpro/.env.e2e

      - name: Inventory controls gate
        run: |
          set -euo pipefail
          mkdir -p artifacts/e2e-logs
          npx playwright test e2e-real/inventory-diagnostic.spec.ts \
            --config=playwright.full-stack.config.ts \
            --project=chromium-gate \
            | tee artifacts/e2e-logs/inventory-controls-gate.txt
        working-directory: maintainpro/apps/web
        env:
          SKIP_E2E_SEED: "true"
          MAINTAINPRO_E2E_ENV_FILE: ${{ github.workspace }}/maintainpro/.env.e2e

      - name: Work-order lifecycle gate
        run: |
          set -euo pipefail
          mkdir -p artifacts/e2e-logs
          npx playwright test e2e-real/work-order-lifecycle-diagnostic.spec.ts \
            --config=playwright.full-stack.config.ts \
            --project=chromium-gate \
            | tee artifacts/e2e-logs/work-order-lifecycle-gate.txt
        working-directory: maintainpro/apps/web
        env:
          SKIP_E2E_SEED: "true"
          MAINTAINPRO_E2E_ENV_FILE: ${{ github.workspace }}/maintainpro/.env.e2e

      - name: Procurement controls gate
        run: |
          set -euo pipefail
          mkdir -p artifacts/e2e-logs
          npx playwright test e2e-real/procurement.spec.ts \
            --config=playwright.full-stack.config.ts \
            --project=chromium-gate \
            | tee artifacts/e2e-logs/procurement-controls-gate.txt
        working-directory: maintainpro/apps/web
        env:
          SKIP_E2E_SEED: "true"
          MAINTAINPRO_E2E_ENV_FILE: ${{ github.workspace }}/maintainpro/.env.e2e

      - name: Backup / restore / disaster-recovery rehearsal gate
        run: |
          set -euo pipefail
          mkdir -p artifacts/e2e-logs
          export RECOVERY_REHEARSAL=true
          export RECOVERY_MONGO_HOST=mongo
          export RECOVERY_SOURCE_DATABASE="${PRIMARY_DATABASE_NAME:-maintainpro_e2e_primary}"
          export RECOVERY_TARGET_DATABASE="maintainpro_restore_${E2E_RUN_ID//[^a-zA-Z0-9_]/_}"
          export RECOVERY_WORK_DIR="$PWD/artifacts/recovery-tmp/$E2E_RUN_ID"
          node scripts/recovery/run-recovery-rehearsal.mjs | tee artifacts/e2e-logs/recovery-rehearsal-gate.txt
        env:
          MAINTAINPRO_E2E_ENV_FILE: ${{ github.workspace }}/maintainpro/.env.e2e

      - name: Management information gate
        run: |
          set -euo pipefail
          mkdir -p artifacts/e2e-logs
          npx playwright test e2e-real/management-info.spec.ts \
            --config=playwright.full-stack.config.ts \
            --project=chromium-gate \
            | tee artifacts/e2e-logs/management-info-gate.txt
        working-directory: maintainpro/apps/web
        env:
          SKIP_E2E_SEED: "true"
          MAINTAINPRO_E2E_ENV_FILE: ${{ github.workspace }}/maintainpro/.env.e2e

      - name: Monitoring / alerting / restart recovery gate
        run: |
          set -euo pipefail
          mkdir -p artifacts/e2e-logs
          npx playwright test e2e-real/operations-controls.spec.ts \
            --config=playwright.full-stack.config.ts \
            --project=chromium-gate \
            | tee ../../artifacts/e2e-logs/operations-controls-gate.txt
        working-directory: maintainpro/apps/web
        env:
          SKIP_E2E_SEED: "true"
          MAINTAINPRO_E2E_ENV_FILE: ${{ github.workspace }}/maintainpro/.env.e2e

      - name: Exact-service restart and dependency recovery rehearsal
        run: |
          set -euo pipefail
          mkdir -p artifacts/e2e-logs
          export OPERATIONS_REHEARSAL=true
          export E2E_TEST_MODE=true
          node scripts/operations/run-operations-rehearsal.mjs | tee artifacts/e2e-logs/operations-rehearsal-gate.txt
        env:
          MAINTAINPRO_E2E_ENV_FILE: ${{ github.workspace }}/maintainpro/.env.e2e

      - name: Release-candidate auth stability gate
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts/e2e-logs
          npx playwright test e2e-real/auth.spec.ts \
            --config=playwright.full-stack.config.ts \
            --project=chromium-desktop \
            --project=mobile-smoke \
            --grep "E2E-AUTH-012" \
            --retries=0 \
            --repeat-each=10 \
            | tee ../../artifacts/e2e-logs/release-candidate-auth-stability-gate.txt
        working-directory: maintainpro/apps/web
        env:
          SKIP_E2E_SEED: "true"
          MAINTAINPRO_E2E_ENV_FILE: ${{ github.workspace }}/maintainpro/.env.e2e

      - name: Run full-stack Playwright suite
        run: npm run test:e2e:full-stack
        env:
          SKIP_E2E_SEED: "true"
          MAINTAINPRO_E2E_ENV_FILE: ${{ github.workspace }}/maintainpro/.env.e2e

      - name: Generate evidence manifest
        if: always()
        run: |
          export E2E_SERVICE_HEALTH=CHECKED
          node scripts/generate-e2e-evidence-manifest.mjs

      - name: Collect redacted service logs
        if: always()
        run: |
          mkdir -p artifacts/e2e-logs
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env.e2e \
            -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color > artifacts/e2e-logs/compose.log || true
          # Redact obvious secret patterns without printing values to workflow summary
          sed -i -E 's/(password|secret|token|authorization)=[^[:space:]]+/\1=REDACTED/Ig' artifacts/e2e-logs/compose.log || true

      - name: Dump mongo/api logs on failure
        if: failure()
        run: |
          mkdir -p artifacts/e2e-logs
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env.e2e \
            -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color mongo > artifacts/e2e-logs/mongo-failure.log || true
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env.e2e \
            -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color api > artifacts/e2e-logs/api-failure.log || true
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env.e2e \
            -f docker-compose.yml -f docker-compose.e2e.yml ps > artifacts/e2e-logs/compose-ps.txt || true
          sed -i -E 's/(password|secret|token|authorization)=[^[:space:]]+/\1=REDACTED/Ig' artifacts/e2e-logs/mongo-failure.log artifacts/e2e-logs/api-failure.log || true

      - name: Stop isolated E2E stack only
        if: always()
        run: |
          # Stop the exact isolated Compose project while preserving all volumes.
          # The GitHub-hosted runner is ephemeral; runner disposal handles the
          # remaining runner filesystem. Never prune globally. Never delete volumes.
          # Project name must start with maintainpro-e2e-.
          case "$COMPOSE_PROJECT_NAME" in
            maintainpro-e2e-*) ;;
            *) echo "Refusing cleanup: unexpected COMPOSE_PROJECT_NAME"; exit 1 ;;
          esac
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env.e2e \
            -f docker-compose.yml -f docker-compose.e2e.yml down --remove-orphans

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-e2e-evidence
          path: |
            maintainpro/apps/web/e2e-real-report/**
            maintainpro/apps/web/e2e-real-results/**
            maintainpro/artifacts/e2e-evidence-manifest.json
            maintainpro/artifacts/e2e-logs/**
            !maintainpro/artifacts/recovery-tmp/**
          if-no-files-found: warn