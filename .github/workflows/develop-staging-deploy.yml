name: Develop Staging Deploy

# Build-only until staging host credentials exist. The deploy job fails on purpose
# so a green workflow cannot be read as a completed deployment.

on:
  workflow_dispatch:
  push:
    branches: ["develop"]

permissions:
  contents: read

defaults:
  run:
    working-directory: maintainpro

jobs:
  staging-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: maintainpro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build monorepo
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api
          NEXT_PUBLIC_API_ORIGIN: http://localhost:3000
          NEXT_PUBLIC_USE_BFF: "true"

  staging-cd:
    needs: staging-build
    runs-on: ubuntu-latest
    steps:
      - name: Staging deployment is blocked
        run: |
          echo "STAGING_CD=BLOCKED"
          echo "No staging API host, database, Redis, storage, or mail credentials are configured in this workflow."
          echo "Images were not pushed. Production was not deployed."
          exit 1
