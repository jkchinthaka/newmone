name: Develop Staging Deploy

# Build on every develop push. The deploy job runs only when the staging host,
# database, Redis, storage, and mail secrets are all set. Missing secrets skip
# that job. They do not fail the workflow.

on:
  workflow_dispatch:
  push:
    branches: ["develop"]

permissions:
  contents: read

defaults:
  run:
    working-directory: maintainpro

jobs:
  staging-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: maintainpro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build monorepo
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api
          NEXT_PUBLIC_API_ORIGIN: http://localhost:3000
          NEXT_PUBLIC_USE_BFF: "true"

  staging-secrets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - name: Probe staging secrets
        id: probe
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
          STAGING_STORAGE: ${{ secrets.STAGING_STORAGE }}
          STAGING_MAIL: ${{ secrets.STAGING_MAIL }}
        run: |
          if [ -n "$STAGING_API_URL" ] && [ -n "$STAGING_DATABASE_URL" ] && [ -n "$STAGING_REDIS_URL" ] && [ -n "$STAGING_STORAGE" ] && [ -n "$STAGING_MAIL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Staging secrets are missing. Deploy job skipped."
          fi

  staging-cd:
    needs: [staging-build, staging-secrets]
    if: needs.staging-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Staging deployment is not implemented
        run: |
          echo "STAGING_CD=BLOCKED"
          echo "Staging secrets are present, but this workflow does not deploy yet."
          echo "Images were not pushed. Production was not deployed."
          exit 1
