services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    # CI injects placeholders via `docker compose --env-file .env.compose-ci`.
    # Production must use docker-compose.production.yml (requires real `.env`, never compose-ci).
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      DATABASE_PROVIDER: mongodb
      PRIMARY_DATABASE_URL: ${PRIMARY_DATABASE_URL:-mongodb://${MONGO_APP_USERNAME:-maintainpro_app}:${MONGO_APP_PASSWORD:-maintainpro_password}@mongo:27017/nelna?authSource=${MONGO_INITDB_DATABASE:-bileeta_db}&replicaSet=rs0}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:-mongodb://${MONGO_APP_USERNAME:-maintainpro_app}:${MONGO_APP_PASSWORD:-maintainpro_password}@mongo:27017/${MONGO_INITDB_DATABASE:-bileeta_db}?authSource=${MONGO_INITDB_DATABASE:-bileeta_db}&replicaSet=rs0}
      DATABASE_URL: ${PRIMARY_DATABASE_URL:-mongodb://${MONGO_APP_USERNAME:-maintainpro_app}:${MONGO_APP_PASSWORD:-maintainpro_password}@mongo:27017/nelna?authSource=${MONGO_INITDB_DATABASE:-bileeta_db}&replicaSet=rs0}
      MONGODB_URI: ${PRIMARY_DATABASE_URL:-mongodb://${MONGO_APP_USERNAME:-maintainpro_app}:${MONGO_APP_PASSWORD:-maintainpro_password}@mongo:27017/nelna?authSource=${MONGO_INITDB_DATABASE:-bileeta_db}&replicaSet=rs0}
      PRIMARY_DATABASE_NAME: ${PRIMARY_DATABASE_NAME:-nelna}
      BACKUP_DATABASE_NAME: ${BACKUP_DATABASE_NAME:-bileeta_db}
      MONGO_DATABASE_NAME: ${PRIMARY_DATABASE_NAME:-nelna}
      MONGO_SYNC_ON_STARTUP: ${MONGO_SYNC_ON_STARTUP:-false}
      DATABASE_REPLICATION_ENABLED: ${DATABASE_REPLICATION_ENABLED:-true}
      DATABASE_REPLICATION_MODE: ${DATABASE_REPLICATION_MODE:-async_outbox}
      DATABASE_REPLICATION_RETRY_ATTEMPTS: ${DATABASE_REPLICATION_RETRY_ATTEMPTS:-5}
      DATABASE_REPLICATION_RETRY_DELAY_MS: ${DATABASE_REPLICATION_RETRY_DELAY_MS:-5000}
      DATABASE_REPLICATION_BATCH_SIZE: ${DATABASE_REPLICATION_BATCH_SIZE:-100}
      BACKUP_DATABASE_REQUIRED_FOR_READINESS: ${BACKUP_DATABASE_REQUIRED_FOR_READINESS:-false}
      BACKUP_DATABASE_REQUIRED_FOR_STRICT_MODE: ${BACKUP_DATABASE_REQUIRED_FOR_STRICT_MODE:-true}
      RAPIDAPI_GOOGLE_MAP_PLACES_KEY: ${RAPIDAPI_GOOGLE_MAP_PLACES_KEY:-}
      REDIS_URL: redis://redis:6379
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      FARM_DEFAULT_LATITUDE: ${FARM_DEFAULT_LATITUDE:-6.9271}
      FARM_DEFAULT_LONGITUDE: ${FARM_DEFAULT_LONGITUDE:-79.8612}
      WEATHER_ALERT_FROST_THRESHOLD_C: ${WEATHER_ALERT_FROST_THRESHOLD_C:-5}
      WEATHER_ALERT_RAIN_THRESHOLD_MM: ${WEATHER_ALERT_RAIN_THRESHOLD_MM:-50}
      TRACEABILITY_PUBLIC_BASE_URL: ${TRACEABILITY_PUBLIC_BASE_URL:-https://trace.nelnafarm.lk}
      RAPIDAPI_COPILOT_API_KEY: ${RAPIDAPI_COPILOT_API_KEY:-}
      RAPIDAPI_COPILOT_HOST: ${RAPIDAPI_COPILOT_HOST:-copilot5.p.rapidapi.com}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-maintainpro-files}
      FG_SSO_SIGNING_SECRET: ${FG_SSO_SIGNING_SECRET:-local-dev-only-fg-sso-signing-secret-32c}
      FG_SSO_ISSUER: ${FG_SSO_ISSUER:-maintainpro}
      FG_SSO_AUDIENCE: ${FG_SSO_AUDIENCE:-fg-digital-recording}
      FG_SSO_TTL_SECONDS: ${FG_SSO_TTL_SECONDS:-60}
      FG_API_INTERNAL_URL: ${FG_API_INTERNAL_URL:-http://fg:8000}
      FG_MOBILE_SESSION_TTL_SECONDS: ${FG_MOBILE_SESSION_TTL_SECONDS:-1800}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "/usr/local/bin/container-http-healthcheck.cjs",
          "--host",
          "127.0.0.1",
          "--port",
          "3000",
          "--path",
          "/api/health/live",
          "--expect",
          "200",
          "--timeout-ms",
          "4000"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost/api}
      NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-http://localhost}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "/usr/local/bin/container-http-healthcheck.cjs",
          "--host",
          "127.0.0.1",
          "--port",
          "3001",
          "--path",
          "/login",
          "--expect",
          "200",
          "--timeout-ms",
          "4000"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 20s
    restart: unless-stopped

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-root_password}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-bileeta_db}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-maintainpro_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-maintainpro_password}
      PRIMARY_DATABASE_NAME: ${PRIMARY_DATABASE_NAME:-nelna}
      BACKUP_DATABASE_NAME: ${BACKUP_DATABASE_NAME:-bileeta_db}
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - maintainpro-mongo-data:/data/db
      - ./infra/mongo/init-app-user.js:/docker-entrypoint-initdb.d/init-app-user.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - maintainpro-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    # Do not publish to 0.0.0.0. Host admin binds belong in
    # docker-compose.local-admin.yml (dev) or docker-compose.production.yml (127.0.0.1 only).
    expose:
      - "9000"
      - "9001"
    volumes:
      - maintainpro-minio-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >-
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin123}; do
        echo 'Waiting for MinIO to become ready...';
        sleep 2;
      done;
      mc mb -p local/${MINIO_BUCKET:-maintainpro-files} || true;
      exit 0;"

  fg-collectstatic:
    build:
      context: ./systems/fg-digital-recording
      dockerfile: Dockerfile
      target: runtime
    image: ${MAINTAINPRO_FG_IMAGE:-maintainpro-fg:${APP_COMMIT_SHA:-local}}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.release_build
      FORCE_SCRIPT_NAME: /fg
      WAIT_FOR_POSTGRES: "0"
      APP_VERSION: ${APP_VERSION:-1.2.0}
    volumes:
      - maintainpro-fg-static:/app/staticfiles
    command:
      [
        "python",
        "manage.py",
        "collectstatic",
        "--noinput"
      ]
    restart: "no"

  # FG Digital Recording — Django/Gunicorn on internal :8000 only.
  # Redis DB index 1 isolates FG cache/Celery keys from Nest/BullMQ on DB 0.
  # FG_REDIS_URL is the documented FG Redis variable (defaults from REDIS_URL host).
  fg:
    build:
      context: ./systems/fg-digital-recording
      dockerfile: Dockerfile
      target: runtime
    image: ${MAINTAINPRO_FG_IMAGE:-maintainpro-fg:${APP_COMMIT_SHA:-local}}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-insecure-development-key-not-for-production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,fg}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      ENVIRONMENT_LABEL: ${ENVIRONMENT_LABEL:-production}
      FG_DATABASE_BACKEND: mongodb
      MONGODB_URI: ${FG_MONGODB_URI:-${MONGODB_URI:-mongodb://${MONGO_APP_USERNAME:-maintainpro_app}:${MONGO_APP_PASSWORD:-maintainpro_password}@mongo:27017/maintainpro_prod?authSource=${MONGO_INITDB_DATABASE:-bileeta_db}&replicaSet=rs0}}
      MONGODB_DATABASE: ${PRIMARY_DATABASE_NAME:-maintainpro_prod}
      MONGODB_PRODUCTION_TARGET_DATABASE: maintainpro_prod
      FG_REDIS_URL: ${FG_REDIS_URL:-redis://redis:6379/1}
      REDIS_URL: ${FG_REDIS_URL:-redis://redis:6379/1}
      FORCE_SCRIPT_NAME: /fg
      WAIT_FOR_POSTGRES: "0"
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}
      MAINTAINPRO_TENANT_ID: ${MAINTAINPRO_TENANT_ID:-}
      MAINTAINPRO_REFERENCE_DATABASE: ${MAINTAINPRO_REFERENCE_DATABASE:-${PRIMARY_DATABASE_NAME:-maintainpro_prod}}
      EVIDENCE_STORAGE_ROOT: /app/media/evidence_private
      APP_VERSION: ${APP_VERSION:-1.2.0}
      FG_SSO_SIGNING_SECRET: ${FG_SSO_SIGNING_SECRET:-local-dev-only-fg-sso-signing-secret-32c}
      FG_SSO_ISSUER: ${FG_SSO_ISSUER:-maintainpro}
      FG_SSO_AUDIENCE: ${FG_SSO_AUDIENCE:-fg-digital-recording}
      FG_PASSWORD_LOGIN_ENABLED: "false"
      MAINTAINPRO_SSO_GATE_ENABLED: "true"
      MAINTAINPRO_JWT_ACCESS_SECRET: ${MAINTAINPRO_JWT_ACCESS_SECRET:-${JWT_ACCESS_SECRET:-local-dev-only-jwt-access-secret-min}}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-dev-only-jwt-access-secret-min}
      MAINTAINPRO_API_INTERNAL_URL: ${MAINTAINPRO_API_INTERNAL_URL:-http://api:3000/api}
      MAINTAINPRO_SSO_REQUIRE_LIVE_REVALIDATION: ${MAINTAINPRO_SSO_REQUIRE_LIVE_REVALIDATION:-true}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      fg-collectstatic:
        condition: service_completed_successfully
    expose:
      - "8000"
    volumes:
      - maintainpro-fg-evidence:/app/media/evidence_private
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:8000/health/live/"
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 30s
    restart: unless-stopped

  fg-celery-worker:
    build:
      context: ./systems/fg-digital-recording
      dockerfile: Dockerfile
      target: runtime
    image: ${MAINTAINPRO_FG_IMAGE:-maintainpro-fg:${APP_COMMIT_SHA:-local}}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-insecure-development-key-not-for-production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,fg}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      ENVIRONMENT_LABEL: ${ENVIRONMENT_LABEL:-production}
      FG_DATABASE_BACKEND: mongodb
      MONGODB_URI: ${FG_MONGODB_URI:-${MONGODB_URI:-mongodb://${MONGO_APP_USERNAME:-maintainpro_app}:${MONGO_APP_PASSWORD:-maintainpro_password}@mongo:27017/maintainpro_prod?authSource=${MONGO_INITDB_DATABASE:-bileeta_db}&replicaSet=rs0}}
      MONGODB_DATABASE: ${PRIMARY_DATABASE_NAME:-maintainpro_prod}
      MONGODB_PRODUCTION_TARGET_DATABASE: maintainpro_prod
      FG_REDIS_URL: ${FG_REDIS_URL:-redis://redis:6379/1}
      REDIS_URL: ${FG_REDIS_URL:-redis://redis:6379/1}
      FORCE_SCRIPT_NAME: /fg
      WAIT_FOR_POSTGRES: "0"
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}
      MAINTAINPRO_TENANT_ID: ${MAINTAINPRO_TENANT_ID:-}
      MAINTAINPRO_REFERENCE_DATABASE: ${MAINTAINPRO_REFERENCE_DATABASE:-${PRIMARY_DATABASE_NAME:-maintainpro_prod}}
      EVIDENCE_STORAGE_ROOT: /app/media/evidence_private
      APP_VERSION: ${APP_VERSION:-1.2.0}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      fg:
        condition: service_started
    volumes:
      - maintainpro-fg-evidence:/app/media/evidence_private
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO"]
    # Worker does not serve HTTP; do not inherit image HEALTHCHECK on :8000.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 30s
    restart: unless-stopped

  # Single beat instance only — do not scale replicas.
  fg-celery-beat:
    build:
      context: ./systems/fg-digital-recording
      dockerfile: Dockerfile
      target: runtime
    image: ${MAINTAINPRO_FG_IMAGE:-maintainpro-fg:${APP_COMMIT_SHA:-local}}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-insecure-development-key-not-for-production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,fg}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      ENVIRONMENT_LABEL: ${ENVIRONMENT_LABEL:-production}
      FG_DATABASE_BACKEND: mongodb
      MONGODB_URI: ${FG_MONGODB_URI:-${MONGODB_URI:-mongodb://${MONGO_APP_USERNAME:-maintainpro_app}:${MONGO_APP_PASSWORD:-maintainpro_password}@mongo:27017/maintainpro_prod?authSource=${MONGO_INITDB_DATABASE:-bileeta_db}&replicaSet=rs0}}
      MONGODB_DATABASE: ${PRIMARY_DATABASE_NAME:-maintainpro_prod}
      MONGODB_PRODUCTION_TARGET_DATABASE: maintainpro_prod
      FG_REDIS_URL: ${FG_REDIS_URL:-redis://redis:6379/1}
      REDIS_URL: ${FG_REDIS_URL:-redis://redis:6379/1}
      FORCE_SCRIPT_NAME: /fg
      WAIT_FOR_POSTGRES: "0"
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}
      APP_VERSION: ${APP_VERSION:-1.2.0}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      fg:
        condition: service_started
    command:
      [
        "celery",
        "-A",
        "config",
        "beat",
        "--loglevel=INFO",
        "--schedule",
        "/tmp/celerybeat-schedule"
      ]
    # Beat has no reliable HTTP probe; disable inherited web HEALTHCHECK.
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      fg:
        condition: service_healthy
      fg-collectstatic:
        condition: service_completed_successfully
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - maintainpro-fg-static:/var/www/fg-static:ro
    healthcheck:
      # nginx:1.27-alpine includes BusyBox wget — verified tool for this image only.
      # Probe liveness (not readiness) to avoid nginx unhealthy during DB outages.
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/api/health/live >/dev/null 2>&1 && wget -qO- http://127.0.0.1/login >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  maintainpro-mongo-data:
  maintainpro-redis-data:
  maintainpro-minio-data:
  maintainpro-fg-static:
  maintainpro-fg-evidence:
