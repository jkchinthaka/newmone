services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    # CI injects placeholders via `docker compose --env-file .env.compose-ci`.
    # Production must use docker-compose.production.yml (requires real `.env`, never compose-ci).
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      DATABASE_PROVIDER: sqlserver
      DATABASE_URL: ${DATABASE_URL:-sqlserver://sqlserver:1433;database=MaintainPro;user=sa;password=MaintainPro_Dev_Passw0rd!;schema=dbo;encrypt=true;trustServerCertificate=true}
      PRIMARY_DATABASE_URL: ${PRIMARY_DATABASE_URL:-sqlserver://sqlserver:1433;database=MaintainPro;user=sa;password=MaintainPro_Dev_Passw0rd!;schema=dbo;encrypt=true;trustServerCertificate=true}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:-}
      MONGODB_URI: ${MONGO_MIGRATION_SOURCE_URL:-}
      PRIMARY_DATABASE_NAME: ${PRIMARY_DATABASE_NAME:-MaintainPro}
      BACKUP_DATABASE_NAME: ${BACKUP_DATABASE_NAME:-}
      MONGO_DATABASE_NAME: ${MONGO_DATABASE_NAME:-}
      MONGO_SYNC_ON_STARTUP: "false"
      DATABASE_REPLICATION_ENABLED: ${DATABASE_REPLICATION_ENABLED:-false}
      DATABASE_REPLICATION_MODE: ${DATABASE_REPLICATION_MODE:-disabled}
      DATABASE_REPLICATION_RETRY_ATTEMPTS: ${DATABASE_REPLICATION_RETRY_ATTEMPTS:-5}
      DATABASE_REPLICATION_RETRY_DELAY_MS: ${DATABASE_REPLICATION_RETRY_DELAY_MS:-5000}
      DATABASE_REPLICATION_BATCH_SIZE: ${DATABASE_REPLICATION_BATCH_SIZE:-100}
      BACKUP_DATABASE_REQUIRED_FOR_READINESS: ${BACKUP_DATABASE_REQUIRED_FOR_READINESS:-false}
      BACKUP_DATABASE_REQUIRED_FOR_STRICT_MODE: ${BACKUP_DATABASE_REQUIRED_FOR_STRICT_MODE:-false}
      RAPIDAPI_GOOGLE_MAP_PLACES_KEY: ${RAPIDAPI_GOOGLE_MAP_PLACES_KEY:-}
      REDIS_URL: redis://redis:6379
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      FARM_DEFAULT_LATITUDE: ${FARM_DEFAULT_LATITUDE:-6.9271}
      FARM_DEFAULT_LONGITUDE: ${FARM_DEFAULT_LONGITUDE:-79.8612}
      WEATHER_ALERT_FROST_THRESHOLD_C: ${WEATHER_ALERT_FROST_THRESHOLD_C:-5}
      WEATHER_ALERT_RAIN_THRESHOLD_MM: ${WEATHER_ALERT_RAIN_THRESHOLD_MM:-50}
      TRACEABILITY_PUBLIC_BASE_URL: ${TRACEABILITY_PUBLIC_BASE_URL:-https://trace.nelnafarm.lk}
      RAPIDAPI_COPILOT_API_KEY: ${RAPIDAPI_COPILOT_API_KEY:-}
      RAPIDAPI_COPILOT_HOST: ${RAPIDAPI_COPILOT_HOST:-copilot5.p.rapidapi.com}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-maintainpro-files}
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "/usr/local/bin/container-http-healthcheck.cjs",
          "--host",
          "127.0.0.1",
          "--port",
          "3000",
          "--path",
          "/api/health/live",
          "--expect",
          "200",
          "--timeout-ms",
          "4000"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost/api}
      NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-http://localhost}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "/usr/local/bin/container-http-healthcheck.cjs",
          "--host",
          "127.0.0.1",
          "--port",
          "3001",
          "--path",
          "/login",
          "--expect",
          "200",
          "--timeout-ms",
          "4000"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 20s
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-MaintainPro_Dev_Passw0rd!}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_HOST_PORT:-1433}:1433"
    volumes:
      - maintainpro-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"IF DB_ID('MaintainPro') IS NULL CREATE DATABASE MaintainPro; SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  # Migration-source MongoDB (not MaintainPro API primary).
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-root_password}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-bileeta_db}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-maintainpro_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-maintainpro_password}
      PRIMARY_DATABASE_NAME: ${PRIMARY_DATABASE_NAME:-MaintainPro}
      BACKUP_DATABASE_NAME: ${BACKUP_DATABASE_NAME:-bileeta_db}
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - maintainpro-mongo-data:/data/db
      - ./infra/mongo/init-app-user.js:/docker-entrypoint-initdb.d/init-app-user.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - maintainpro-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  minio:
    # Official images publish to Quay; Docker Hub minio/minio often denies anonymous pulls in CI.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    # Do not publish to 0.0.0.0. Host admin binds belong in
    # docker-compose.local-admin.yml (dev) or docker-compose.production.yml (127.0.0.1 only).
    expose:
      - "9000"
      - "9001"
    volumes:
      - maintainpro-minio-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >-
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin123}; do
        echo 'Waiting for MinIO to become ready...';
        sleep 2;
      done;
      mc mb -p local/${MINIO_BUCKET:-maintainpro-files} || true;
      exit 0;"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # nginx:1.27-alpine includes BusyBox wget — verified tool for this image only.
      # Probe liveness (not readiness) to avoid nginx unhealthy during DB outages.
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/api/health/live >/dev/null 2>&1 && wget -qO- http://127.0.0.1/login >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  maintainpro-sqlserver-data:
  maintainpro-mongo-data:
  maintainpro-redis-data:
  maintainpro-minio-data:
