# Production Compose override for MaintainPro (Windows Server / Docker).
#
# Usage (operator machine — real `.env` never committed):
#   docker compose --env-file .env -f docker-compose.yml -f docker-compose.production.yml config
#   docker compose --env-file .env -f docker-compose.yml -f docker-compose.production.yml up -d
#
# Rules:
# - Loads required `.env` only (never `.env.compose-ci`).
# - Mandatory secrets have no weak defaults — missing vars fail at config time.
# - Restricted services bind to 127.0.0.1 only (or remain unpublished).
# - Public port 80 ownership (Nginx vs IIS) is an unanswered ops question — unchanged here.
# - Placeholders in `.env.production.example` are NOT deployable credentials.

services:
  api:
    # SHA tag is the source of truth. Optional RELEASE_VERSION tag may also be built.
    # Example: MAINTAINPRO_API_IMAGE=maintainpro-api:d400de4aea65e0ad8379616b983b0e91713cfca9
    image: ${MAINTAINPRO_API_IMAGE:-maintainpro-api:${APP_COMMIT_SHA:?APP_COMMIT_SHA is required}}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    env_file:
      - path: ${MAINTAINPRO_COMPOSE_ENV_FILE:-.env}
        required: true
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      DATABASE_PROVIDER: mongodb
      PRIMARY_DATABASE_URL: ${PRIMARY_DATABASE_URL:?PRIMARY_DATABASE_URL is required}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:?BACKUP_DATABASE_URL is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      PRIMARY_DATABASE_NAME: ${PRIMARY_DATABASE_NAME:?PRIMARY_DATABASE_NAME is required}
      BACKUP_DATABASE_NAME: ${BACKUP_DATABASE_NAME:?BACKUP_DATABASE_NAME is required}
      MONGO_DATABASE_NAME: ${MONGO_DATABASE_NAME:?MONGO_DATABASE_NAME is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
      APP_VERSION: ${APP_VERSION:-1.2.0}
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:?APP_COMMIT_SHA is required}
      APP_BUILD_TIMESTAMP: ${APP_BUILD_TIMESTAMP:?APP_BUILD_TIMESTAMP is required}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      APP_SERVICE_NAME: maintainpro-api
    # API remains internal-only (no host publish).
    expose:
      - "3000"

  web:
    image: ${MAINTAINPRO_WEB_IMAGE:-maintainpro-web:${APP_COMMIT_SHA:?APP_COMMIT_SHA is required}}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
    env_file:
      - path: ${MAINTAINPRO_COMPOSE_ENV_FILE:-.env}
        required: true
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}
      NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:?NEXT_PUBLIC_API_ORIGIN is required}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      # Browser uses same-origin BFF; server-side upstream uses Docker DNS.
      NEXT_PUBLIC_USE_BFF: ${NEXT_PUBLIC_USE_BFF:-true}
      API_INTERNAL_URL: ${API_INTERNAL_URL:?API_INTERNAL_URL is required}
      # Cookie Secure policy — production defaults secure unless dual HTTP opt-in is set in `.env`.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}
      APP_VERSION: ${APP_VERSION:-1.2.0}
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:?APP_COMMIT_SHA is required}
      APP_BUILD_TIMESTAMP: ${APP_BUILD_TIMESTAMP:?APP_BUILD_TIMESTAMP is required}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      APP_SERVICE_NAME: maintainpro-web
    expose:
      - "3001"

  mongo:
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:?MONGO_INITDB_DATABASE is required}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?MONGO_APP_USERNAME is required}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
    # Host access for operators only — never 0.0.0.0.
    ports:
      - "127.0.0.1:27018:27017"

  redis:
    # Explicitly unpublished; Docker network only.
    expose:
      - "6379"

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    # Host admin console only on loopback — never 0.0.0.0.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  minio-init:
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
    entrypoint: >-
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ACCESS_KEY\" \"$$MINIO_SECRET_KEY\"; do
        echo 'Waiting for MinIO to become ready...';
        sleep 2;
      done;
      mc mb -p local/$$MINIO_BUCKET || true;
      exit 0;"

  fg-collectstatic:
    image: ${MAINTAINPRO_FG_IMAGE:-maintainpro-fg:${APP_COMMIT_SHA:?APP_COMMIT_SHA is required}}
    environment:
      WAIT_FOR_POSTGRES: "0"
      FORCE_SCRIPT_NAME: /fg
      DJANGO_SETTINGS_MODULE: config.settings.release_build

  fg:
    image: ${MAINTAINPRO_FG_IMAGE:-maintainpro-fg:${APP_COMMIT_SHA:?APP_COMMIT_SHA is required}}
    env_file:
      - path: ${MAINTAINPRO_COMPOSE_ENV_FILE:-.env}
        required: true
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?DJANGO_CSRF_TRUSTED_ORIGINS is required}
      ENVIRONMENT_LABEL: production
      FG_DATABASE_BACKEND: mongodb
      MONGODB_URI: ${FG_MONGODB_URI:-${MONGODB_URI:?MONGODB_URI is required}}
      MONGODB_DATABASE: maintainpro_prod
      MONGODB_PRODUCTION_TARGET_DATABASE: maintainpro_prod
      PRIMARY_DATABASE_NAME: maintainpro_prod
      FG_REDIS_URL: ${FG_REDIS_URL:-redis://redis:6379/1}
      REDIS_URL: ${FG_REDIS_URL:-redis://redis:6379/1}
      FORCE_SCRIPT_NAME: /fg
      WAIT_FOR_POSTGRES: "0"
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}
      MAINTAINPRO_TENANT_ID: ${MAINTAINPRO_TENANT_ID:-}
      MAINTAINPRO_REFERENCE_DATABASE: ${MAINTAINPRO_REFERENCE_DATABASE:-maintainpro_prod}
      EVIDENCE_STORAGE_ROOT: /app/media/evidence_private
      APP_VERSION: ${APP_VERSION:-1.2.0}
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:?APP_COMMIT_SHA is required}
      FG_SSO_SIGNING_SECRET: ${FG_SSO_SIGNING_SECRET:?FG_SSO_SIGNING_SECRET is required}
      FG_SSO_ISSUER: ${FG_SSO_ISSUER:-maintainpro}
      FG_SSO_AUDIENCE: ${FG_SSO_AUDIENCE:-fg-digital-recording}
      FG_PASSWORD_LOGIN_ENABLED: "false"
      MAINTAINPRO_SSO_GATE_ENABLED: "true"
      MAINTAINPRO_JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      MAINTAINPRO_API_INTERNAL_URL: ${MAINTAINPRO_API_INTERNAL_URL:-http://api:3000/api}
      MAINTAINPRO_SSO_REQUIRE_LIVE_REVALIDATION: "true"

  fg-celery-worker:
    image: ${MAINTAINPRO_FG_IMAGE:-maintainpro-fg:${APP_COMMIT_SHA:?APP_COMMIT_SHA is required}}
    env_file:
      - path: ${MAINTAINPRO_COMPOSE_ENV_FILE:-.env}
        required: true
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?DJANGO_CSRF_TRUSTED_ORIGINS is required}
      ENVIRONMENT_LABEL: production
      FG_DATABASE_BACKEND: mongodb
      MONGODB_URI: ${FG_MONGODB_URI:-${MONGODB_URI:?MONGODB_URI is required}}
      MONGODB_DATABASE: maintainpro_prod
      MONGODB_PRODUCTION_TARGET_DATABASE: maintainpro_prod
      FG_REDIS_URL: ${FG_REDIS_URL:-redis://redis:6379/1}
      REDIS_URL: ${FG_REDIS_URL:-redis://redis:6379/1}
      FORCE_SCRIPT_NAME: /fg
      WAIT_FOR_POSTGRES: "0"
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}
      EVIDENCE_STORAGE_ROOT: /app/media/evidence_private
      APP_VERSION: ${APP_VERSION:-1.2.0}

  fg-celery-beat:
    image: ${MAINTAINPRO_FG_IMAGE:-maintainpro-fg:${APP_COMMIT_SHA:?APP_COMMIT_SHA is required}}
    env_file:
      - path: ${MAINTAINPRO_COMPOSE_ENV_FILE:-.env}
        required: true
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?DJANGO_CSRF_TRUSTED_ORIGINS is required}
      ENVIRONMENT_LABEL: production
      FG_DATABASE_BACKEND: mongodb
      MONGODB_URI: ${FG_MONGODB_URI:-${MONGODB_URI:?MONGODB_URI is required}}
      MONGODB_DATABASE: maintainpro_prod
      MONGODB_PRODUCTION_TARGET_DATABASE: maintainpro_prod
      FG_REDIS_URL: ${FG_REDIS_URL:-redis://redis:6379/1}
      REDIS_URL: ${FG_REDIS_URL:-redis://redis:6379/1}
      FORCE_SCRIPT_NAME: /fg
      WAIT_FOR_POSTGRES: "0"
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}
      APP_VERSION: ${APP_VERSION:-1.2.0}

  nginx:
    # Public :80 left unchanged pending IIS-versus-Nginx ownership decision.
    ports:
      - "80:80"