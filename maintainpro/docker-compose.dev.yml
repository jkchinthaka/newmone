services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      DATABASE_PROVIDER: sqlserver
      # Host .env uses localhost; containers must use the Compose service name.
      DATABASE_URL: ${DOCKER_DATABASE_URL:-sqlserver://sqlserver:1433;database=MaintainProDev;user=sa;password=MaintainPro_Dev_Passw0rd!;schema=dbo;encrypt=true;trustServerCertificate=true}
      PRIMARY_DATABASE_URL: ${DOCKER_PRIMARY_DATABASE_URL:-sqlserver://sqlserver:1433;database=MaintainProDev;user=sa;password=MaintainPro_Dev_Passw0rd!;schema=dbo;encrypt=true;trustServerCertificate=true}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:-}
      MONGODB_URI: ${MONGO_MIGRATION_SOURCE_URL:-}
      PRIMARY_DATABASE_NAME: ${PRIMARY_DATABASE_NAME:-MaintainProDev}
      BACKUP_DATABASE_NAME: ${BACKUP_DATABASE_NAME:-}
      MONGO_DATABASE_NAME: ${MONGO_DATABASE_NAME:-}
      MONGO_SYNC_ON_STARTUP: "false"
      DATABASE_REPLICATION_ENABLED: ${DATABASE_REPLICATION_ENABLED:-false}
      DATABASE_REPLICATION_MODE: ${DATABASE_REPLICATION_MODE:-disabled}
      DATABASE_REPLICATION_RETRY_ATTEMPTS: ${DATABASE_REPLICATION_RETRY_ATTEMPTS:-5}
      DATABASE_REPLICATION_RETRY_DELAY_MS: ${DATABASE_REPLICATION_RETRY_DELAY_MS:-5000}
      DATABASE_REPLICATION_BATCH_SIZE: ${DATABASE_REPLICATION_BATCH_SIZE:-100}
      BACKUP_DATABASE_REQUIRED_FOR_READINESS: ${BACKUP_DATABASE_REQUIRED_FOR_READINESS:-false}
      BACKUP_DATABASE_REQUIRED_FOR_STRICT_MODE: ${BACKUP_DATABASE_REQUIRED_FOR_STRICT_MODE:-false}
      RAPIDAPI_GOOGLE_MAP_PLACES_KEY: ${RAPIDAPI_GOOGLE_MAP_PLACES_KEY:-}
      REDIS_URL: redis://redis:6379
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      FARM_DEFAULT_LATITUDE: ${FARM_DEFAULT_LATITUDE:-6.9271}
      FARM_DEFAULT_LONGITUDE: ${FARM_DEFAULT_LONGITUDE:-79.8612}
      WEATHER_ALERT_FROST_THRESHOLD_C: ${WEATHER_ALERT_FROST_THRESHOLD_C:-5}
      WEATHER_ALERT_RAIN_THRESHOLD_MM: ${WEATHER_ALERT_RAIN_THRESHOLD_MM:-50}
      TRACEABILITY_PUBLIC_BASE_URL: ${TRACEABILITY_PUBLIC_BASE_URL:-https://trace.nelnafarm.lk}
      RAPIDAPI_COPILOT_API_KEY: ${RAPIDAPI_COPILOT_API_KEY:-}
      RAPIDAPI_COPILOT_HOST: ${RAPIDAPI_COPILOT_HOST:-copilot5.p.rapidapi.com}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-maintainpro-files}
    command: npm run dev --workspace @maintainpro/api
    ports:
      - "3000:3000"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - .:/workspace
      - maintainpro-node-modules:/workspace/node_modules
      - maintainpro-api-dist:/workspace/apps/api/dist

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      # Server-side BFF traffic must use the Docker service name. This also
      # overrides apps/web/.env.local's host-only localhost value.
      API_INTERNAL_URL: ${DOCKER_API_INTERNAL_URL:-http://api:3000/api}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000/api}
      NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-http://localhost:3000}
    command: npm run dev --workspace @maintainpro/web
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_started
    volumes:
      - .:/workspace
      - maintainpro-node-modules:/workspace/node_modules
      - maintainpro-web-next:/workspace/apps/web/.next

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-MaintainPro_Dev_Passw0rd!}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_HOST_PORT:-14333}:1433"
    volumes:
      - maintainpro-sqlserver-data-dev:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"IF DB_ID('MaintainProDev') IS NULL CREATE DATABASE MaintainProDev; SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  # Migration-source only (not API primary).
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-root_password}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-bileeta_db}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-maintainpro_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-maintainpro_password}
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - maintainpro-mongo-data-dev:/data/db
      - ./infra/mongo/init-app-user.js:/docker-entrypoint-initdb.d/init-app-user.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - maintainpro-redis-data-dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - maintainpro-minio-data-dev:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >-
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin123}; do
        echo 'Waiting for MinIO to become ready...';
        sleep 2;
      done;
      mc mb -p local/${MINIO_BUCKET:-maintainpro-files} || true;
      exit 0;"

volumes:
  maintainpro-node-modules:
  maintainpro-api-dist:
  maintainpro-web-next:
  maintainpro-sqlserver-data-dev:
  maintainpro-mongo-data-dev:
  maintainpro-redis-data-dev:
  maintainpro-minio-data-dev:
