name: maintainpro_mobile
description: MaintainPro Mobile V2 — field operations for facility & fleet management.
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.0
  socket_io_client: ^3.0.1

  # Secure storage & auth
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # Offline / local DB (Drift + SQLite)
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  crypto: ^3.0.6

  # Scanning & media
  mobile_scanner: ^6.0.6
  image_picker: ^1.1.2

  # Push notifications (optional at runtime)
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.3
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
