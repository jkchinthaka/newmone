upstream maintainpro_web {
  server web:3001;
}

upstream maintainpro_api {
  server api:3000;
}

# Preserve client X-Request-Id when present; otherwise use nginx $request_id.
# Nest/BFF echo a single response X-Request-Id — avoid nginx add_header on API
# paths so clients do not receive duplicate comma-joined values.
map $http_x_request_id $maintainpro_request_id {
  ""      $request_id;
  default $http_x_request_id;
}

log_format maintainpro_ops_json escape=json
  '{'
  '"timestamp":"$time_iso8601",'
  '"requestId":"$maintainpro_request_id",'
  '"method":"$request_method",'
  '"uri":"$uri",'
  '"status":$status,'
  '"requestTimeMs":$request_time,'
  '"upstreamStatus":"$upstream_status",'
  '"upstreamTimeMs":"$upstream_response_time",'
  '"bytesSent":$bytes_sent'
  '}';

server {
  listen 80;
  server_name _;

  client_max_body_size 25m;
  access_log /dev/stdout maintainpro_ops_json;
  error_log /dev/stderr warn;

  # Baseline security headers (HSTS is HTTPS-termination owned — not set on plain :80).
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # Conservative CSP fragment — full script CSP remains app/CDN owned to avoid breaking Next.js.
  add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

  location /socket.io/ {
    proxy_pass http://maintainpro_api/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $maintainpro_request_id;
    proxy_cache_bypass $http_upgrade;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # Same-origin BFF — MUST appear before generic /api/
  # Do not add a trailing slash on proxy_pass (preserves /api/backend/... URI).
  location ^~ /api/backend/ {
    proxy_pass http://maintainpro_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $maintainpro_request_id;
    add_header X-Request-Id $maintainpro_request_id always;
    # Successful BFF login returns multiple large HttpOnly JWT Set-Cookie headers.
    # Default proxy_buffer_size (4k/8k) is too small and nginx returns 502 Bad Gateway.
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location /api/ {
    proxy_pass http://maintainpro_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $maintainpro_request_id;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location / {
    proxy_pass http://maintainpro_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $maintainpro_request_id;
    add_header X-Request-Id $maintainpro_request_id always;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }
}