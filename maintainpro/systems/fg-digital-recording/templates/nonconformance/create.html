{% extends "base.html" %}
{% block title %}Open NCR — Nelna FG Digital Recording System{% endblock %}
{% block body_class %}mgmt-shell{% endblock %}
{% block content %}
  <section class="mgmt-page" aria-labelledby="ncr-create-heading">
    <header class="mgmt-page__header">
      <div>
        <h1 id="ncr-create-heading">Open nonconformance</h1>
        <p class="mgmt-page__lead">Manual case only. Organization {{ organization.code }}.</p>
      </div>
    </header>
    <form method="post" class="mgmt-form">
      {% csrf_token %}
      <div class="form-field">
        <label for="id_code">Code</label>
        <input class="form-input" id="id_code" name="code" required>
      </div>
      <div class="form-field">
        <label for="id_title">Title</label>
        <input class="form-input" id="id_title" name="title" required>
      </div>
      <div class="form-field">
        <label for="id_batch_reference">Batch reference</label>
        <input class="form-input" id="id_batch_reference" name="batch_reference">
      </div>
      <div class="form-field">
        <label for="id_description">Description</label>
        <textarea class="form-input" id="id_description" name="description" rows="4"></textarea>
      </div>
      <div class="form-field">
        <label for="id_containment">Containment</label>
        <textarea class="form-input" id="id_containment" name="containment" rows="3"></textarea>
      </div>
      <button type="submit" class="btn btn--primary">Open case</button>
    </form>
  </section>
{% endblock %}
