{% extends "base.html" %}
{% block title %}Forbidden — Nelna FG Digital Recording System{% endblock %}
{% block content %}
  <section class="error-page-card" aria-labelledby="error-heading">
    <h1 id="error-heading">403 — Forbidden</h1>
    <p>You do not have permission to access this resource.</p>
    <p>
      {% if user.is_authenticated %}
        <a href="{% url 'accounts:landing' %}">Return to landing</a>
      {% else %}
        <a href="{% url 'accounts:login' %}">Sign in</a>
      {% endif %}
    </p>
  </section>
{% endblock %}
