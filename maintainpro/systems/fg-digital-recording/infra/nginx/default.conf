# Example site config for FG under MaintainPro same-domain /fg/ mount.
# No real domain is configured here.

upstream nelna_fg_gunicorn {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name app.example.invalid;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /fg/static/ {
        alias /var/www/nelna-fg/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /fg/health/live/ {
        proxy_pass http://nelna_fg_gunicorn/health/live/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Script-Name /fg;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /fg/health/ready/ {
        proxy_pass http://nelna_fg_gunicorn/health/ready/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Script-Name /fg;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /fg/ {
        proxy_pass http://nelna_fg_gunicorn/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Script-Name /fg;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
